[package]
name = "kmeans_colors"
version = "0.7.1"
authors = ["okaneco <47607823+okaneco@users.noreply.github.com>"]
edition = "2018"
exclude = ["test", "gfx", ".github"]
homepage = "https://github.com/okaneco/kmeans-colors"
repository = "https://github.com/okaneco/kmeans-colors"
readme = "README.md"
keywords = ["kmeans", "clustering", "lab", "color", "rgb"]
categories = ["graphics", "multimedia::images", "mathematics"]
license = "MIT OR Apache-2.0"
description = """Simple k-means clustering to find dominant colors in images.
Backed by a generic k-means implementation offered as a standalone library."""

[features]
# Use default-features=false if using as a library
default = ["app"]

# Features required for building the binary
app = ["hashbrown", "image", "palette_color", "structopt"]

# Enable `palette` color types
palette_color = ["num-traits", "palette"]

# Fast, non-cryptographic hash algorithms and collections.
[dependencies.hashbrown]
version = "0.17"
default-features = false
features = ["default-hasher", "inline-more"]
optional = true

[dependencies.image]
version = "0.25.10"
default-features = false
features = ["jpeg", "png"]
optional = true

[dependencies.palette]
version = "0.7.7"
default-features = false
features = ["std"]
optional = true

[dependencies.num-traits]
version = "0.2.19"
default-features = false
features = ["std"]
optional = true

[dependencies.rand]
version = "0.10.3"
default-features = false
features = ["thread_rng"]

[dependencies.rand_chacha]
version = "0.10.0"
default-features = false

[dependencies.structopt]
version = "0.3.26"
default-features = false
optional = true

[profile.release]
strip = true

[[bin]]
name = "kmeans_colors"
path = "src/bin/kmeans_colors/main.rs"
required-features = ["app"]

[[bench]]
name = "kmeans"
harness = false
required-features = ["app"]

[package.metadata.docs.rs]
no-default-features = true
features = ["palette_color"]
targets = []
